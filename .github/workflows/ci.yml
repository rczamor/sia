name: CI

# Actions are pinned to commit SHAs (tag in the comment) and Python deps to
# constraints.txt so CI runs are reproducible; Dependabot keeps both fresh.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt ruff
      - run: ruff check app/ tests/ scripts/

  import-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: lint-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/sia_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -v

  lockfile-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Lockfile satisfies pyproject
        # Installing with the constraints proves every pyproject requirement still
        # resolves inside the lock (a floor bumped past its pin fails here).
        run: pip install --dry-run --quiet -c constraints.txt -e ".[dev]"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Dependency audit (locked environment, pinned tooling)
        run: |
          pip install -c constraints.txt pip-audit
          pip install -c constraints.txt -e .
          pip-audit
      - name: Bandit static analysis
        # Suppressions are inline `# nosec <id>` with a justifying comment;
        # tests are excluded via [tool.bandit] in pyproject.toml.
        run: |
          pip install -c constraints.txt bandit
          bandit -c pyproject.toml -r app/ scripts/ -q
      - name: Vendored assets match pinned hashes
        run: python scripts/verify_vendor_assets.py
      - name: No CDN script/style references
        # The admin UI must execute no third-party-hosted code; assets are
        # vendored (see docs/supply-chain.md). Tests also assert the CSP.
        run: |
          paths="app/templates app/static/js app/gateway/authn.py"
          for p in $paths; do
            test -e "$p" || { echo "::error::scan path $p missing"; exit 1; }
          done
          if grep -RInE 'https?://(cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com)' \
              $paths; then
            echo "::error::CDN reference found — vendor the asset instead"; exit 1
          fi

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: pip wheel --no-deps -w dist .
      - name: Install wheel and import from outside the repo
        # Proves the package is self-contained: templates/static (incl. vendored
        # assets) ship in the wheel and resolve package-relative from any cwd.
        run: |
          pip install -c constraints.txt dist/*.whl
          cd /tmp
          python - <<'EOF'
          import app.main
          from app.templating import STATIC_DIR, TEMPLATES_DIR
          assert (TEMPLATES_DIR / "base.html").is_file()
          for asset in ("pico.min.css", "htmx.min.js", "cytoscape.min.js"):
              path = STATIC_DIR / "vendor" / asset
              assert path.is_file() and path.stat().st_size > 10_000, asset
          print("wheel smoke OK")
          EOF
