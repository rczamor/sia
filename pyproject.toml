[project]
name = "sia"
version = "0.1.0"
description = "Sia — an open-source Context Engine: serves decision-ready context to any AI agent harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "anthropic>=0.42.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "trafilatura>=2.0.0",
    "procrastinate>=2.15.0",
    "langfuse>=2.60.0,<3",
]

[project.entry-points."sia.plugins"]
anthropic = "app.plugins.llm.anthropic:AnthropicLLMPlugin"
openrouter = "app.plugins.llm.openrouter:OpenRouterLLMPlugin"
ollama = "app.plugins.embeddings.ollama:OllamaEmbeddingsPlugin"
langfuse = "app.plugins.llmops.langfuse:LangfusePlugin"
feedly = "app.plugins.ingestion.feedly:FeedlyIngestion"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Four-layer contract: interface (api/ui/jobs) → runtime → retrieval → data, with
# models/providers/plugins as shared infrastructure below. Imports flow downward only.
# The Context layer (app.context) slots between interface and retrieval in Phase 2.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "data layer imports nothing above it"
type = "forbidden"
source_modules = ["app.data"]
forbidden_modules = ["app.retrieval", "app.runtime", "app.jobs", "app.api", "app.ui", "app.main"]

[[tool.importlinter.contracts]]
name = "retrieval layer imports nothing above it"
type = "forbidden"
source_modules = ["app.retrieval"]
forbidden_modules = ["app.context", "app.runtime", "app.jobs", "app.api", "app.ui", "app.main"]

[[tool.importlinter.contracts]]
name = "context layer imports nothing above it"
type = "forbidden"
source_modules = ["app.context"]
forbidden_modules = ["app.runtime", "app.jobs", "app.api", "app.ui", "app.main"]

[[tool.importlinter.contracts]]
name = "runtime composition root is below interface layers"
type = "forbidden"
source_modules = ["app.runtime"]
forbidden_modules = ["app.jobs", "app.api", "app.ui", "app.main"]

[[tool.importlinter.contracts]]
name = "models are the bottom layer"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = ["app.data", "app.retrieval", "app.runtime", "app.jobs", "app.api", "app.ui", "app.providers", "app.plugins"]

[[tool.importlinter.contracts]]
name = "providers and plugins are infrastructure only"
type = "forbidden"
source_modules = ["app.providers", "app.plugins"]
forbidden_modules = ["app.data", "app.retrieval", "app.runtime", "app.jobs", "app.api", "app.ui", "app.main"]
