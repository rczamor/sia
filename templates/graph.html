{% extends "base.html" %}
{% set active = "graph" %}
{% block title %}Graph{% endblock %}

{% block content %}
<hgroup>
    <h1>Knowledge Graph</h1>
    <p>Topics, skills, and entities — structure and health in one view</p>
</hgroup>

<div role="group" id="graph-filters" style="max-width: 32rem">
    <button data-filter="all" class="contrast">All</button>
    <button data-filter="topic" class="secondary">Topics</button>
    <button data-filter="skill" class="secondary">Skills</button>
    <button data-filter="entity" class="secondary">Entities</button>
</div>

<div id="cy" style="height: 70vh; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius);"></div>
<p><small id="graph-stats"></small></p>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script>
const PILLAR_COLORS = {
    context_layers: "#2563eb",
    product_mgmt: "#7c3aed",
    leadership: "#059669",
};

async function renderGraph() {
    const response = await fetch("/api/context/graph");
    const data = await response.json();
    const elements = [];
    for (const node of data.nodes) {
        elements.push({ data: {
            id: node.id,
            label: node.label,
            kind: node.kind,
            color: node.kind === "entity" ? "#94a3b8" : (PILLAR_COLORS[node.pillar] || "#f59e0b"),
            size: 18 + (node.priority || 0.4) * 26,
            shape: node.kind === "skill" ? "round-rectangle" : (node.kind === "entity" ? "diamond" : "ellipse"),
            faded: node.status === "stale" || node.status === "archived" ? 0.35 : 1,
        }});
    }
    for (const edge of data.edges) {
        elements.push({ data: {
            id: edge.source + "->" + edge.predicate + "->" + edge.target,
            source: edge.source, target: edge.target, predicate: edge.predicate,
            style: edge.predicate === "contradicts" ? "dashed" : "solid",
            lineColor: edge.predicate === "contradicts" ? "#dc2626" : "#64748b",
        }});
    }
    document.getElementById("graph-stats").textContent =
        data.nodes.length + " nodes, " + data.edges.length + " edges";

    const cy = cytoscape({
        container: document.getElementById("cy"),
        elements,
        style: [
            { selector: "node", style: {
                label: "data(label)", "background-color": "data(color)",
                width: "data(size)", height: "data(size)", shape: "data(shape)",
                opacity: "data(faded)",
                "font-size": "9px", color: "#e2e8f0",
                "text-wrap": "ellipsis", "text-max-width": "120px",
            }},
            { selector: "edge", style: {
                width: 1.5, "line-color": "data(lineColor)", "line-style": "data(style)",
                "curve-style": "bezier", "target-arrow-shape": "triangle",
                "target-arrow-color": "data(lineColor)", "arrow-scale": 0.7,
            }},
        ],
        layout: { name: "cose", animate: false, nodeRepulsion: 9000 },
    });

    document.querySelectorAll("#graph-filters button").forEach((btn) => {
        btn.addEventListener("click", () => {
            const filter = btn.dataset.filter;
            cy.nodes().forEach((n) => {
                const show = filter === "all" || n.data("kind") === filter;
                n.style("display", show ? "element" : "none");
            });
        });
    });
}
renderGraph();
</script>
{% endblock %}
