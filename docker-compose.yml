services:
  engine:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    env_file: .env
    volumes:
      - .:/app
    command: procrastinate --app=app.jobs.queue.job_queue worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
