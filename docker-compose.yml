services:
  engine:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - context-store:/srv/sia/context
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    env_file: .env
    environment:
      SIA_SKIP_MIGRATE: "1"  # the engine owns migrations; the worker waits for them
    volumes:
      - .:/app
      - context-store:/srv/sia/context
    command: procrastinate --app=app.jobs.queue.job_queue worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional bundled Postgres for self-hosters who don't bring their own (Neon etc.):
  #   docker compose --profile bundled-db up
  # and set DATABASE_URL=postgresql+asyncpg://sia:sia@db/sia in .env
  db:
    image: pgvector/pgvector:pg16
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER: sia
      POSTGRES_PASSWORD: sia
      POSTGRES_DB: sia
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  context-store:
  pgdata:
